# Codex 0.156.1 multi-agent role registration.
#
# Hybrid does not set agents.default_subagent_model here. The framework's
# logical routing policy lives in core/routing/model-routing.json. Every
# Hybrid-controlled inference receives an explicit model and reasoning effort;
# an unavailable override fails closed instead of inheriting the session model.
[agents]
enabled = true
max_depth = 1
max_concurrent_threads_per_session = 8

[agents."scout"]
description = "Repository scout"
config_file = "agents/scout.toml"

[agents."researcher"]
description = "Technical researcher and requirements analyst"
config_file = "agents/researcher.toml"

[agents."planner"]
description = "Execution planner"
config_file = "agents/planner.toml"

[agents."design-architect"]
description = "UI design architect"
config_file = "agents/design-architect.toml"

[agents."design-executor"]
